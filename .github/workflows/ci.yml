name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }} - ${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release, Debug]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup MSVC Developer Command Prompt (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Build Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build

      - name: Install Build Dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ninja

      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DDRISHTI_BUILD_TESTS=ON \
            -DDRISHTI_BUILD_CLI=ON \
            -DDRISHTI_ENABLE_LLVM=OFF

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
            -DDRISHTI_BUILD_TESTS=ON `
            -DDRISHTI_BUILD_CLI=ON `
            -DDRISHTI_ENABLE_LLVM=OFF

      - name: Build All Targets
        run: |
          cmake --build build --config ${{ matrix.build_type }}

      - name: Run Test Suite (CTest)
        run: |
          ctest --test-dir build --build-config ${{ matrix.build_type }} --output-on-failure -E TritonIntegration
