[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drishti"
version = "0.1.0"
description = "Dṛṣṭi: ML Compiler and GPU Performance Analysis Framework"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [
    {name = "Drishti Team"}
]
keywords = [
    "compiler",
    "gpu",
    "triton",
    "llvm",
    "mlir",
    "cuda",
    "profiling",
    "performance",
    "deep-learning",
    "optimization"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C++",
    "Topic :: Software Development :: Compilers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "wheel",
    "build",
]

[project.scripts]
drishti = "drishti.cli:main"

[project.urls]
Homepage = "https://github.com/drishti-ml/drishti"
Repository = "https://github.com/drishti-ml/drishti.git"
Issues = "https://github.com/drishti-ml/drishti/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
drishti = ["bin/*", "templates/*"]
