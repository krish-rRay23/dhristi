<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101010"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>

    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#191919"/>
      <stop offset="100%" stop-color="#101010"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" rx="16" fill="url(#background)"/>
  <rect width="1200" height="400" rx="16" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="398" rx="15"
        fill="none" stroke="#383838" stroke-width="1"/>

  <!-- Header -->
  <rect x="42" y="30" width="172" height="27" rx="5"
        fill="#181818" stroke="#454545" stroke-width="1"/>

  <text x="128" y="48" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="11"
        font-weight="600" letter-spacing="1.5" fill="#c5c5c5">
    GPU PERFORMANCE RESEARCH
  </text>

  <text x="42" y="108"
        font-family="Arial, sans-serif" font-size="48"
        font-weight="700" letter-spacing="-1.5" fill="#ffffff">
    Dhristi
  </text>

  <text x="43" y="137"
        font-family="Arial, sans-serif" font-size="17"
        fill="#b0b0b0">
    Hardware-Aware ML Compiler Performance Intelligence
  </text>

  <text x="43" y="165"
        font-family="Arial, sans-serif" font-size="12"
        fill="#777777">
    Connecting compiler transformations to actual GPU execution
  </text>

  <!-- Metric Card 1 -->
  <g transform="translate(42, 195)">
    <rect width="270" height="112" rx="9"
          fill="url(#panel)" stroke="#414141"/>

    <text x="19" y="25" font-family="Arial, sans-serif"
          font-size="10" font-weight="600"
          letter-spacing="1.2" fill="#969696">
      KERNEL LATENCY
    </text>

    <text x="19" y="64" font-family="Arial, sans-serif"
          font-size="33" font-weight="700" fill="#ffffff">
      −32.8%
    </text>

    <path d="M19 78H251" stroke="#353535"/>

    <text x="19" y="96" font-family="Arial, sans-serif"
          font-size="11" fill="#b7b7b7">
      0.1438 ms → 0.0967 ms
    </text>
  </g>

  <!-- Metric Card 2 -->
  <g transform="translate(327, 195)">
    <rect width="270" height="112" rx="9"
          fill="url(#panel)" stroke="#414141"/>

    <text x="19" y="25" font-family="Arial, sans-serif"
          font-size="10" font-weight="600"
          letter-spacing="1.1" fill="#969696">
      EFFECTIVE MEMORY BANDWIDTH
    </text>

    <text x="19" y="64" font-family="Arial, sans-serif"
          font-size="33" font-weight="700" fill="#ffffff">
      +48.8%
    </text>

    <path d="M19 78H251" stroke="#353535"/>

    <text x="19" y="96" font-family="Arial, sans-serif"
          font-size="11" fill="#b7b7b7">
      16.20 → 24.11 GB/s
    </text>
  </g>

  <!-- Metric Card 3 -->
  <g transform="translate(612, 195)">
    <rect width="270" height="112" rx="9"
          fill="url(#panel)" stroke="#414141"/>

    <text x="19" y="25" font-family="Arial, sans-serif"
          font-size="10" font-weight="600"
          letter-spacing="1.1" fill="#969696">
      LLVM IR OPTIMIZATION
    </text>

    <text x="19" y="64" font-family="Arial, sans-serif"
          font-size="33" font-weight="700" fill="#ffffff">
      −55.4%
    </text>

    <path d="M19 78H251" stroke="#353535"/>

    <text x="19" y="96" font-family="Arial, sans-serif"
          font-size="11" fill="#b7b7b7">
      Fewer IR instructions in tested pipeline
    </text>
  </g>

  <!-- Metric Card 4 -->
  <g transform="translate(897, 195)">
    <rect width="261" height="112" rx="9"
          fill="url(#panel)" stroke="#414141"/>

    <text x="19" y="25" font-family="Arial, sans-serif"
          font-size="10" font-weight="600"
          letter-spacing="1.1" fill="#969696">
      MEMORY VECTORIZATION
    </text>

    <text x="19" y="64" font-family="Arial, sans-serif"
          font-size="33" font-weight="700" fill="#ffffff">
      4×
    </text>

    <path d="M19 78H242" stroke="#353535"/>

    <text x="19" y="96" font-family="Arial, sans-serif"
          font-size="11" fill="#b7b7b7">
      32 → 8 instructions per warp
    </text>
  </g>

  <!-- Research Summary -->
  <rect x="42" y="326" width="1116" height="46" rx="7"
        fill="#141414" stroke="#353535"/>

  <rect x="42" y="326" width="3" height="46" rx="1.5"
        fill="#d0d0d0"/>

  <text x="59" y="345" font-family="Arial, sans-serif"
        font-size="10" font-weight="600"
        letter-spacing="1.2" fill="#a0a0a0">
    CORE PRINCIPLE
  </text>

  <text x="59" y="362" font-family="Arial, sans-serif"
        font-size="12" fill="#e1e1e1">
    Compiler-level improvements matter only when validated against actual hardware execution.
  </text>
</svg>
