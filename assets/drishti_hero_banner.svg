<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a11" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f293d" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.05" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Ambient Glow Background Circles -->
  <circle cx="200" cy="80" r="180" fill="#06b6d4" opacity="0.08" filter="url(#glow)" />
  <circle cx="1000" cy="280" r="220" fill="#8b5cf6" opacity="0.08" filter="url(#glow)" />

  <!-- Grid Motif -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200" />
    <path d="M150 0 V360 M300 0 V360 M450 0 V360 M600 0 V360 M750 0 V360 M900 0 V360 M1050 0 V360" />
  </g>

  <!-- Title Badge -->
  <rect x="50" y="45" width="220" height="30" rx="15" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" opacity="0.9" />
  <text x="160" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#38bdf8" text-anchor="middle" letter-spacing="1">RESEARCH FRAMEWORK</text>

  <!-- Main Title -->
  <text x="50" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="url(#cyanPurple)" letter-spacing="-1">Dṛṣṭi (Drishti)</text>

  <!-- Subtitle -->
  <text x="50" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">Hardware-Aware ML Compiler Performance Intelligence &amp; Profiling</text>

  <!-- Metric Card 1 -->
  <g transform="translate(50, 210)">
    <rect width="250" height="100" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect width="250" height="100" rx="12" fill="url(#glowGrad)" />
    <text x="24" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800" fill="#38bdf8">160 / 160</text>
    <text x="24" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">VERIFIED JOURNAL MATRIX</text>
    <text x="24" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">100% Real Hardware GPU Execution</text>
  </g>

  <!-- Metric Card 2 -->
  <g transform="translate(325, 210)">
    <rect width="250" height="100" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect width="250" height="100" rx="12" fill="url(#glowGrad)" />
    <text x="24" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800" fill="#a855f7">2.07×</text>
    <text x="24" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">ATTENTION SPEEDUP</text>
    <text x="24" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">FlashAttn Long on Tesla T4</text>
  </g>

  <!-- Metric Card 3 -->
  <g transform="translate(600, 210)">
    <rect width="250" height="100" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect width="250" height="100" rx="12" fill="url(#glowGrad)" />
    <text x="24" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800" fill="#34d399">55.4%</text>
    <text x="24" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">LLVM-IR INSTRUCTION REDUCTION</text>
    <text x="24" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">SROA + InstCombine + DCE</text>
  </g>

  <!-- Metric Card 4 -->
  <g transform="translate(875, 210)">
    <rect width="275" height="100" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect width="275" height="100" rx="12" fill="url(#glowGrad)" />
    <text x="24" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800" fill="#f43f5e">15.4% MAPE</text>
    <text x="24" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">CALIBRATED COST MODEL</text>
    <text x="24" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Analytical Roofline Hardware Error</text>
  </g>
</svg>
